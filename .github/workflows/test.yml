name: Tests

on: [push, pull_request]

jobs:
  # Server tests on every supported Node line (engines.node >=18).
  #   - lint and repo-wide checks run once, on the `primary` entry.
  #   - coverage (c8 12) needs Node ^20.19 || ^22.12 || >=23; ESLint 10 needs
  #     ^20.19 || ^22.13 || >=24. Node 18 runs the same tests with plain
  #     `node --test`, no coverage gate.
  #   - The fixture site uses Hexo 7 by default; one entry uses Hexo 8
  #     (Hexo 8 needs Node >=20.19).
  lint-and-server:
    name: server (node ${{ matrix.node }}, hexo ${{ matrix.hexo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24', '26']
        hexo: ['7']
        include:
          - node: '18'
            legacy: true
          - node: '22'
            primary: true
          - node: '24'
            hexo: '8'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install fixture site dependencies (Hexo ${{ matrix.hexo }})
        working-directory: tests/fixtures/hexo-site
        run: |
          npm pkg set "dependencies.hexo=^${{ matrix.hexo }}"
          npm install --no-audit --no-fund
          node -p "'fixture hexo ' + require('hexo/package.json').version"

      - name: Lint
        if: matrix.primary
        run: npm run lint

      - name: Server tests (with 100% coverage gate)
        if: ${{ !matrix.legacy }}
        run: npm run test:server

      - name: Server tests (no coverage; c8 does not support this Node)
        if: matrix.legacy
        run: |
          npm run build
          node --test tests/server/*.test.js tests/*.test.js

      - name: Check wiki pages
        if: matrix.primary
        run: python3 scripts/check-wiki.py

      - name: Wiki publish script tests
        if: matrix.primary
        run: bash scripts/test-wiki-publish.sh

      - name: Upload coverage report
        if: always() && matrix.primary
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  release-tooling:
    # Offline tests for the GitHub Release notes generator (fake gh, temp git repos).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: release-issues.py unit tests
        # Run the file directly: the hyphenated name is not importable, so
        # `unittest discover` would silently find zero tests.
        run: python3 scripts/release-issues_tests.py

      - name: release-notes.sh test
        run: bash scripts/test-release-notes.sh

  # Real Hexo build + real browsers. Every engine runs the full suite against
  # the Hexo 7 fixture; Chromium also runs it against Hexo 8 (the Hexo major
  # changes the generated HTML, not the browser behavior).
  e2e:
    name: e2e (${{ matrix.browser }}, hexo ${{ matrix.hexo }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        hexo: ['7', '8']
        shard: [1, 2]
        exclude:
          - browser: firefox
            hexo: '8'
          - browser: webkit
            hexo: '8'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install fixture site dependencies (Hexo ${{ matrix.hexo }})
        working-directory: tests/fixtures/hexo-site
        run: |
          npm pkg set "dependencies.hexo=^${{ matrix.hexo }}"
          npm install --no-audit --no-fund
          node -p "'fixture hexo ' + require('hexo/package.json').version"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests (${{ matrix.browser }}, shard ${{ matrix.shard }}/2)
        run: npx playwright test --config tests/e2e/playwright.config.js --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-hexo${{ matrix.hexo }}-shard-${{ matrix.shard }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
