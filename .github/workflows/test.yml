name: Tests

on: [push, pull_request]

jobs:
  lint-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'tests/fixtures/hexo-site/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install fixture site dependencies
        run: cd tests/fixtures/hexo-site && npm install --no-audit --no-fund && cd ../../..

      - name: Lint
        run: npm run lint

      - name: Server tests (with coverage)
        run: npm run test:server

      - name: Wiki publish script tests
        run: bash scripts/test-wiki-publish.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  release-tooling:
    # Offline tests for the GitHub Release notes generator (fake gh, temp git repos).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: release-issues.py unit tests
        # Run the file directly: the hyphenated name is not importable, so
        # `unittest discover` would silently find zero tests.
        run: python3 scripts/release-issues_tests.py

      - name: release-notes.sh test
        run: bash scripts/test-release-notes.sh

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'tests/fixtures/hexo-site/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}

      - name: Install fixture site dependencies
        run: cd tests/fixtures/hexo-site && npm install --no-audit --no-fund && cd ../../..

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --config tests/e2e/playwright.config.js --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
