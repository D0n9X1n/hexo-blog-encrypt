# Publishes hexo-blog-encrypt to npm when a `v*` tag is pushed.
#
# Pre-flight (manual, before tagging):
#   1. Bump `version` in `package.json` to match the tag (e.g. `v4.0.0` → `4.0.0`).
#   2. Revert `demo/package.json`'s `hexo-blog-encrypt` from `"file:.."`
#      back to `"^X.Y.Z"` so the deployed demo references the published
#      package, not a local file: path.
#      We deliberately do NOT use `prepublishOnly` to mutate this file —
#      that would leave a dirty working tree and risk corrupted commits.
#   3. Commit, push, then create+push the `v*` tag.
#
# There is no CHANGELOG file: the GitHub Release created by the
# `github-release` job below is the release history.
#
# Auth: Trusted Publishing via OIDC.
#   Configure the trusted publisher on npmjs.com:
#     https://www.npmjs.com/package/hexo-blog-encrypt/access
#       → Trusted Publishers → GitHub Actions
#       → org D0n9X1n, repo hexo-blog-encrypt, workflow release.yml
#   No long-lived NPM_TOKEN secret is required. The `id-token: write`
#   permission below + npm CLI >= 11.5.1 + `--provenance` is enough.

name: Release to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # OIDC — required for trusted publishing AND --provenance

# Never cancel a half-completed publish — let any in-flight job finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to a version that supports OIDC trusted publishing
        # Node 20 ships with npm 10.x; trusted publishing needs >= 11.5.1.
        # Pinning to ^11 keeps us inside the major while picking up patches.
        run: npm install -g npm@^11

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node20-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Verify demo references published package, not file:..
        run: |
          if grep -q '"hexo-blog-encrypt": *"file:' demo/package.json; then
            echo "::error::demo/package.json still references 'file:..' — revert to a semver range before tagging"
            exit 1
          fi

      - name: Run full test suite (lint + server + e2e)
        run: npm test

      - name: Verify tarball contents
        run: |
          npm pack --dry-run --json > pack.json
          node build/verify-pack.js pack.json

      - name: Publish to npm (OIDC trusted publisher + provenance)
        # No NODE_AUTH_TOKEN: npm detects the GitHub Actions OIDC issuer
        # via the id-token permission above and exchanges it with the
        # trusted publisher configured for this package on npmjs.com.
        run: npm publish --provenance --access public

  # Create the GitHub Release for the tag AFTER npm publish succeeds.
  #
  # Deliberately a SEPARATE job from `publish`: the publish job does OIDC
  # trusted publishing and is kept at `contents: read` (least privilege for
  # the most sensitive credential). Only this job gets `contents: write`,
  # and it has NO `id-token` — so the release-notes step can never touch the
  # npm-publishing token, and vice-versa.
  #
  # Release notes are generated by scripts/release-notes.sh (SonicTerm style):
  # install line + registry links, "Resolved issues" (issues proven closed by
  # non-reverted commits/PRs in the tag range, via scripts/release-issues.py),
  # the commits since the previous tag with a compare link, and a
  # verification summary. GitHub Releases are the release history (there is
  # no CHANGELOG file). The script is
  # fail-closed: a GitHub API failure fails the job instead of publishing
  # notes with a silently empty issue list. Idempotent: re-running the
  # workflow edits the existing Release instead of failing.
  github-release:
    name: GitHub Release ${{ github.ref_name }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # scoped to THIS job only — create/edit Releases
      issues: read           # closure events for "Resolved issues"
      pull-requests: read    # PR closingIssuesReferences for "Resolved issues"

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release-notes.sh rejects shallow clones

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          echo "----- release notes -----"
          cat notes.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
